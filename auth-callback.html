<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>إكمال تسجيل الدخول | القافية</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#3e2723;font-family:system-ui,Tahoma,sans-serif;text-align:center}main{padding:24px;max-width:520px}a{color:#3e2723}p{line-height:1.9}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=20261021-authfix"></script>
</head>
<body><main><h2>القافية</h2><p id="status" role="status">جارٍ إكمال تسجيل الدخول باستخدام Google…</p><p><a href="/">العودة إلى الرئيسية</a></p></main>
<script>
(async function(){
  const status=document.getElementById('status');
  const client=window.supabaseClient;
  if(!client){status.textContent='تعذر تحميل خدمة تسجيل الدخول. حدّث الصفحة وحاول مرة أخرى.';return;}
  try{
    const params=new URLSearchParams(location.search);
    const hash=new URLSearchParams(location.hash.slice(1));
    const oauthError=params.get('error_description')||hash.get('error_description')||params.get('error')||hash.get('error');
    if(oauthError)throw new Error(oauthError);
    // Supabase JS v2 detects and stores the OAuth session from URL automatically.
    const result=await client.auth.getSession();
    if(result.error)throw result.error;
    if(!result.data?.session){
      throw new Error('لم يتم إنشاء جلسة تسجيل الدخول. حاول مرة أخرى.');
    }
    try{localStorage.removeItem('qafiyah_google_oauth_pending')}catch(_){}
    location.replace('/profile.html');
  }catch(error){
    console.error('القافية: تعذر إكمال تسجيل الدخول:',error);
    status.textContent='لم يكتمل تسجيل الدخول: '+(error?.message||'خطأ غير معروف')+'. حاول تسجيل الدخول مرة أخرى.';
  }
})();
</script></body></html>
