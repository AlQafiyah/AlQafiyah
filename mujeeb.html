<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مُجيب | القافية</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="qafiyah-new.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="mujeeb.js" defer></script></head><body><header class="site-header"><div class="header-container"><a href="index.html" style="font-size:25px;font-weight:bold">القافية</a><nav style="display:flex;gap:15px;align-items:center;flex-wrap:wrap"><a href="Poems.html">القصائد</a><a href="midmar.html">مِضمار</a><a href="index.html">الرئيسية</a></nav></div></header><main class="q-app"><h1>✦ مُجيب</h1><p class="q-subtitle">رفيقك الذكي في عالم الشعر والأدب العربي</p><section class="q-panel"><div id="muChat" class="q-chat" role="log" aria-live="polite"><div class="q-message bot">مرحباً! أنا مُجيب، رفيقك في الشعر والأدب العربي. اسألني عن قصيدة أو شاعر أو بحر أو قافية.</div></div><form id="muForm" class="q-toolbar" style="margin-top:15px"><textarea id="muInput" class="q-input" rows="2" maxlength="1500" style="flex:1;min-width:200px" placeholder="اكتب سؤالك الأدبي هنا..." required aria-label="سؤالك لمجيب"></textarea><button class="q-button" id="muSend" type="submit">إرسال ↖</button><button class="q-button secondary" id="muClear" type="button">محادثة جديدة</button></form><div id="muStatus" class="q-note" role="status">قد يخطئ مُجيب في نسبة الأبيات أو الأوزان؛ تحقق من المصادر، خاصة عند الاقتباس.</div></section><section class="q-panel"><h2>أدوات سريعة</h2><div class="q-toolbar"><button class="q-button secondary mu-sample" data-question="اشرح لي بحور الشعر العربي وأشهر تفعيلاتها">بحور الشعر</button><button class="q-button secondary mu-sample" data-question="كيف أكتب قصيدة فصيحة موزونة على بحر الكامل؟">تأليف القصائد</button><button class="q-button secondary mu-sample" data-question="ما الفرق بين القافية وحرف الروي؟">القافية والروي</button><button class="q-button secondary mu-sample" data-question="كيف أحلل الصور البيانية في بيت شعري؟">النقد والبلاغة</button></div><label for="rhymeInput">تحليل أولي لحرف الروي (تقريبي ولا يغني عن علم القافية)</label><div class="q-toolbar"><input id="rhymeInput" class="q-input" style="flex:1" placeholder="اكتب بيتاً أو نهاية بيت"><button id="rhymeBtn" class="q-button secondary" type="button">حلّل</button></div><p id="rhymeResult" class="q-note"></p></section></main></body></html>
