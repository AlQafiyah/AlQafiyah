<body>
 <div class="mu-app">
  <header class="mu-head" aria-label="رأس محادثة مُجيب">
   <div class="mu-head-inner">
    <button class="mu-icon mu-back" id="muBack" type="button" aria-label="رجوع" title="رجوع"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
    <div class="mu-avatar" id="muAvatar" aria-label="الصورة الشخصية لمُجيب"><svg class="mu-person" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></svg></div>
    <div class="mu-identity"><strong id="muName">مُجيب</strong><span id="muSubtitle">مساعد القافية الأدبي</span></div>
    <div class="mu-head-actions">
     <button class="mu-icon" id="muNew" type="button" title="محادثة جديدة" aria-label="محادثة جديدة"><svg viewBox="0 0 24 24"><path d="M12 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/><path d="m14 5 5 5M10 14l9-9a2.12 2.12 0 0 1 3 3l-9 9-5 1z"/></svg></button>
     <button class="mu-icon" id="muArchive" type="button" title="المحادثات السابقة" aria-label="المحادثات السابقة"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8M10 12h4"/></svg></button>
     <button class="mu-icon mu-theme-button" id="muTheme" type="button" title="التبديل للوضع النهاري" aria-label="التبديل للوضع النهاري" aria-pressed="false"><svg viewBox="0 0 24 24" id="muThemeIcon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button>
    </div>
   </div>
  </header>
  <main class="mu-chat" aria-label="محادثة مُجيب">
   <div class="mu-wallpaper" aria-hidden="true"></div>
   <div class="mu-messages" id="muChat" role="log" aria-live="polite" aria-label="رسائل المحادثة"></div>
  </main>
  <div class="mu-bottom">
   <div class="mu-bottom-inner">
    <div id="muAttachments" class="mu-attachments" hidden></div>
    <div id="muToast" class="mu-toast" role="status" aria-live="polite" hidden></div>
    <form id="muForm" class="mu-compose">
     <button id="muPlus" class="mu-icon mu-plus" type="button" aria-label="إرفاق صورة أو ملف" title="إرفاق صورة أو ملف"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
     <textarea id="muInput" rows="1" maxlength="1500" aria-label="اكتب سؤالك" placeholder="اكتب سؤالك"></textarea>
     <button class="mu-send" id="muAction" type="button" aria-label="الإملاء الصوتي" title="الإملاء الصوتي"><svg viewBox="0 0 24 24" id="muActionIcon"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"/></svg></button>
     <input type="file" id="muFile" accept="image/png,image/jpeg,image/webp,text/plain,text/markdown,text/csv,application/json,.txt,.md,.csv,.json" hidden>
    </form>
    <p class="mu-disclaimer">قد يخطئ مُجيب؛ تحقّق من المعلومات الأدبية المهمة.</p>
   </div>
  </div>
 </div>
 <div id="muArchiveOverlay" class="mu-overlay" hidden>
  <div class="mu-panel" role="dialog" aria-modal="true" aria-labelledby="muArchiveTitle">
   <div class="mu-panel-head"><strong id="muArchiveTitle">المحادثات السابقة</strong><button type="button" class="mu-icon" id="muCloseArchive" aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
   <div id="muArchiveList" class="mu-archive-list"></div>
  </div>
 </div>
