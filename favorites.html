<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3E2723"><title>المفضلة | القافية</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"><style>.q-simple-top{background:#3E2723;color:#fff}.q-simple-top>div{width:min(1080px,calc(100% - 30px));margin:auto;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}.q-simple-top a{color:#fff;text-decoration:none}.q-brand{font-size:1.55rem;font-weight:700}.q-back{opacity:.85}.q-fav-card .q-favorite-btn{position:static;margin-inline-start:auto;flex:0 0 auto}</style></head><body>
<header class="q-simple-top"><div><a class="q-brand" href="index.html">القافية</a><a class="q-back" href="index.html">العودة للرئيسية ←</a></div></header>
<main class="q-page-shell"><h1 class="q-page-title">المفضلة</h1><p class="q-page-lead">كل ما حفظته من مقالات وقصائد وشعراء في مكان واحد.</p><div class="q-tabs" id="favoriteTabs"><button class="q-tab active" data-filter="all">الكل</button><button class="q-tab" data-filter="article">المقالات</button><button class="q-tab" data-filter="poem">القصائد</button><button class="q-tab" data-filter="poet">الشعراء</button></div><div class="q-fav-grid" id="favoritesGrid"></div></main>
<script src="enhancements.js"></script><script>
(function(){const grid=document.getElementById('favoritesGrid');let filter='all';const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const typeName={article:'مقال',poem:'قصيدة',poet:'شاعر'};function data(){try{return JSON.parse(localStorage.getItem('qafiyah_favorites')||'[]')}catch{return[]}}function remove(key){localStorage.setItem('qafiyah_favorites',JSON.stringify(data().filter(x=>x.key!==key)));render()}function render(){const items=data().filter(x=>filter==='all'||x.type===filter);if(!items.length){grid.innerHTML='<div class="q-empty">لا توجد عناصر في هذا القسم من المفضلة حتى الآن.</div>';return}grid.innerHTML='';items.forEach(x=>{const card=document.createElement('article');card.className='q-fav-card';card.innerHTML=(x.img?'<a href="'+esc(x.url)+'"><img src="'+esc(x.img)+'" alt=""></a>':'')+'<div><p>'+esc(typeName[x.type]||'محفوظ')+'</p><h3><a href="'+esc(x.url)+'">'+esc(x.title)+'</a></h3>'+(x.meta?'<p>'+esc(x.meta)+'</p>':'')+'</div>';const b=document.createElement('button');b.type='button';b.className='q-favorite-btn is-favorite';b.setAttribute('aria-label','إزالة من المفضلة');b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.7a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.5 1-1a5.5 5.5 0 0 0 0-7.8Z"></path></svg>';b.onclick=()=>remove(x.key);card.appendChild(b);grid.appendChild(card)})}document.getElementById('favoriteTabs').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.q-tab').forEach(x=>x.classList.toggle('active',x===b));render()});document.addEventListener('qafiyah:favorites-changed',render);render()})();
</script></body></html>
