<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3E2723"><title>الإعدادات | القافية</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css?v=footer-final-3"><style>.q-simple-top{background:#3E2723;color:#fff}.q-simple-top>div{width:min(1080px,calc(100% - 30px));margin:auto;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}.q-simple-top a{color:#fff;text-decoration:none}.q-brand{font-size:1.55rem;font-weight:700}.q-back{opacity:.85}</style></head><body><script>(function(){try{var t=localStorage.getItem('qafiyah_theme')||'natural';if(t==='light')t='evening';if(!/^(natural|dark|morning|evening|night)$/.test(t))t='natural';document.documentElement.setAttribute('data-q-theme',t);document.body.setAttribute('data-q-theme',t)}catch(e){}})();</script>
<main class="q-page-shell"><a class="q-page-return" href="index.html">العودة للصفحة الرئيسية ←</a><h1 class="q-page-title">الإعدادات</h1><p class="q-page-lead">خصّص طريقة عرض القافية كما تحب. تحفظ اختياراتك تلقائيًا على هذا الجهاز.</p>
<div class="q-settings-grid">
<section class="q-settings-card"><h2>الخطوط</h2><div class="q-font-grid" id="fontChoices"></div></section>
<section class="q-settings-card"><h2>الرؤية</h2><div class="q-theme-grid" id="themeChoices"></div></section>
<section class="q-settings-card"><h2>اللغة</h2><button class="q-choice q-lang-btn" id="languageButton" type="button">العربية <small>لغة الموسوعة</small></button></section>
</div></main>
<div class="q-modal" id="languageModal" aria-hidden="true"><div class="q-modal-card"><button class="q-modal-close" id="closeLanguageModal" type="button" aria-label="إغلاق">×</button><p>هل صدّقت؟ إنها موسوعة أدب وشعر عربي، وتريد لغة أخرى؟</p></div></div>
<script src="enhancements.js?v=footer-final-3"></script><script>
(function(){const fonts=(window.QafiyahEnhancements&&window.QafiyahEnhancements.fonts)||{};const names=[['saudi','السعودي العريض','الأساسي'],['expo','إكسبو عربي','فاخر'],['expoLight','إكسبو عربي خفيف','خفيف'],['amiri','أميري','نسخ كلاسيكي'],['naskh','النسخ','Noto Naskh Arabic'],['aref','الرقعة','Aref Ruqaa Ink'],['kufi','الكوفي','Noto Kufi Arabic'],['reem','ريم كوفي','كوفي حديث'],['cairo','كايرو','حديث'],['tajawal','تجوال','حديث'],['messiri','المسيري','أنيق'],['changa','تشانغا','مميز'],['ibm','IBM Plex عربي','معاصر'],['mada','مدى','هادئ'],['harmattan','هارماتان','تراثي'],['scheherazade','شهرزاد','نسخ فاخر'],['lateef','لطيف','تراثي'],['katibeh','كتيبة','زخرفي']];const host=document.getElementById('fontChoices');function draw(){const current=localStorage.getItem('qafiyah_font')||'saudi';host.innerHTML='';names.forEach(([key,name,note])=>{const b=document.createElement('button');b.type='button';b.className='q-choice'+(key===current?' active':'');b.style.fontFamily=fonts[key]||fonts.saudi;b.innerHTML='<strong>'+name+'</strong><small>'+(key==='saudi'?'(الأساسي) — ':'')+note+'</small>';b.onclick=()=>{localStorage.setItem('qafiyah_font',key);document.documentElement.style.setProperty('--qafiyah-font-family',fonts[key]||fonts.saudi);draw()};host.appendChild(b)})}draw();const themes=[['natural','الطبيعية','الرؤية الأصلية لقافية'],['morning','صباحية','دافئة ومشرقة ومريحة'],['evening','مسائية','درجات غروب هادئة ومتوازنة'],['night','ليلية','أزرق ليلي هادئ'],['dark','داكنة','داكنة دافئة عالية الوضوح']];const th=document.getElementById('themeChoices');function drawThemes(){const cur=(window.QafiyahEnhancements&&window.QafiyahEnhancements.normalizeTheme?window.QafiyahEnhancements.normalizeTheme(localStorage.getItem('qafiyah_theme')||'natural'):(localStorage.getItem('qafiyah_theme')||'natural'));th.innerHTML='';themes.forEach(([key,name,note])=>{const b=document.createElement('button');b.type='button';b.className='q-choice'+(key===cur?' active':'');b.innerHTML='<strong>'+name+'</strong><small>'+note+'</small>';b.onclick=()=>{if(window.QafiyahEnhancements&&window.QafiyahEnhancements.applyTheme){window.QafiyahEnhancements.applyTheme(key)}else{localStorage.setItem('qafiyah_theme',key);document.documentElement.setAttribute('data-q-theme',key);document.body.setAttribute('data-q-theme',key)}drawThemes()};th.appendChild(b)})}drawThemes();const m=document.getElementById('languageModal');document.getElementById('languageButton').onclick=()=>{m.classList.add('open');m.setAttribute('aria-hidden','false')};function close(){m.classList.remove('open');m.setAttribute('aria-hidden','true')}document.getElementById('closeLanguageModal').onclick=close;m.addEventListener('click',e=>{if(e.target===m)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()})})();
</script></body></html>
