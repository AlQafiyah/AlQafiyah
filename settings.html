<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3E2723"><title>الإعدادات | القافية</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css?v=revolution-1"><link rel="stylesheet" href="qafiyah-v2.css?v=revolution-1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script></head><body><script>(function(){try{var t=localStorage.getItem('qafiyah_theme')||'natural';if(t==='light')t='evening';if(!/^(natural|dark|morning|evening|night)$/.test(t))t='natural';document.documentElement.setAttribute('data-q-theme',t);document.body.setAttribute('data-q-theme',t)}catch(e){}})();</script>
<main class="q-page-shell"><h1 class="q-page-title">الإعدادات</h1><p class="q-page-lead">خصّص القافية كما تحب. تحفظ اختيارات الخط والمظهر تلقائيًا على هذا الجهاز.</p>
<div class="q-settings-grid">
<section class="q-setting-disclosure" id="fontDisclosure"><button class="q-setting-trigger" type="button"><span><strong>الخطوط</strong><small id="fontCurrent">الأساسي</small></span><span class="q-setting-chevron">⌄</span></button><div class="q-setting-options" id="fontChoices"></div></section>
<section class="q-setting-disclosure" id="themeDisclosure"><button class="q-setting-trigger" type="button"><span><strong>المظهر</strong><small id="themeCurrent">الطبيعية</small></span><span class="q-setting-chevron">⌄</span></button><div class="q-setting-options" id="themeChoices"></div></section>
<section class="q-setting-disclosure" id="languageDisclosure"><button class="q-setting-trigger" id="languageButton" type="button"><span><strong>اللغة</strong><small>العربية</small></span><span class="q-setting-chevron">⌄</span></button></section>
<section class="q-setting-disclosure q-setting-legal" data-setting-key="copyright"><button class="q-setting-trigger" type="button"><span><strong>حقوق الطبع والنشر</strong><small>معلومات حقوق المحتوى واستخدامه</small></span><span class="q-setting-chevron">⌄</span></button><div class="q-setting-options"><div class="q-setting-legal-content" id="copyrightContent">جاري التحميل...</div></div></section>
<section class="q-setting-disclosure q-setting-legal" data-setting-key="privacy"><button class="q-setting-trigger" type="button"><span><strong>سياسة الخصوصية</strong><small>طريقة التعامل مع البيانات والخصوصية</small></span><span class="q-setting-chevron">⌄</span></button><div class="q-setting-options"><div class="q-setting-legal-content" id="privacyContent">جاري التحميل...</div></div></section>
</div></main>
<div class="q-modal" id="languageModal" aria-hidden="true"><div class="q-modal-card"><button class="q-modal-close" id="closeLanguageModal" type="button" aria-label="إغلاق">×</button><p>هل صدّقت؟ إنها موسوعة أدب وشعر عربي، وتريد لغة أخرى؟</p></div></div>
<script src="enhancements.js?v=revolution-1"></script><script src="qafiyah-v2.js?v=revolution-1"></script><script>
(function(){
const E=window.QafiyahEnhancements||{},fonts=E.fonts||{};
const names=[['saudi','السعودي العريض','(الأساسي)'],['expo','إكسبو عربي','فاخر'],['expoLight','إكسبو عربي خفيف','خفيف'],['amiri','أميري','نسخ كلاسيكي'],['naskh','النسخ','Noto Naskh Arabic'],['aref','الرقعة','Aref Ruqaa Ink'],['kufi','الكوفي','Noto Kufi Arabic'],['reem','ريم كوفي','كوفي حديث'],['cairo','كايرو','حديث'],['tajawal','تجوال','حديث'],['messiri','المسيري','أنيق'],['changa','تشانغا','مميز'],['ibm','IBM Plex عربي','معاصر'],['mada','مدى','هادئ'],['harmattan','هارماتان','تراثي'],['scheherazade','شهرزاد','نسخ فاخر'],['lateef','لطيف','تراثي'],['katibeh','كتيبة','زخرفي']];
const host=document.getElementById('fontChoices'),fontCur=document.getElementById('fontCurrent');
function drawFonts(){const current=localStorage.getItem('qafiyah_font')||'saudi';host.innerHTML='';names.forEach(([key,name,note])=>{const b=document.createElement('button');b.type='button';b.className='q-choice'+(key===current?' active':'');b.style.setProperty('font-family',fonts[key]||fonts.saudi,'important');b.innerHTML='<strong>'+name+'</strong><small>'+note+'</small>';b.onclick=()=>{localStorage.setItem('qafiyah_font',key);document.documentElement.style.setProperty('--qafiyah-font-family',fonts[key]||fonts.saudi);drawFonts()};host.appendChild(b)});const found=names.find(x=>x[0]===current);fontCur.textContent=found?found[1]:'الأساسي'}drawFonts();
const themes=[['natural','الطبيعية','المظهر الأصلي لقافية'],['morning','صباحية','دافئة ومشرقة'],['evening','مسائية','درجات غروب هادئة'],['night','ليلية','أزرق ليلي هادئ'],['dark','داكنة','داكنة دافئة عالية الوضوح']],th=document.getElementById('themeChoices'),themeCur=document.getElementById('themeCurrent');function drawThemes(){const cur=E.normalizeTheme?E.normalizeTheme(localStorage.getItem('qafiyah_theme')||'natural'):(localStorage.getItem('qafiyah_theme')||'natural');th.innerHTML='';themes.forEach(([key,name,note])=>{const b=document.createElement('button');b.type='button';b.className='q-choice'+(key===cur?' active':'');b.innerHTML='<strong>'+name+'</strong><small>'+note+'</small>';b.onclick=()=>{E.applyTheme?E.applyTheme(key):(localStorage.setItem('qafiyah_theme',key),document.documentElement.setAttribute('data-q-theme',key),document.body.setAttribute('data-q-theme',key));drawThemes()};th.appendChild(b)});themeCur.textContent=(themes.find(x=>x[0]===cur)||themes[0])[1]}drawThemes();
document.querySelectorAll('.q-setting-disclosure:not(#languageDisclosure)').forEach(box=>box.querySelector('.q-setting-trigger')?.addEventListener('click',()=>box.classList.toggle('open')));
const m=document.getElementById('languageModal');document.getElementById('languageButton').onclick=()=>{m.classList.add('open');m.setAttribute('aria-hidden','false')};const close=()=>{m.classList.remove('open');m.setAttribute('aria-hidden','true')};document.getElementById('closeLanguageModal').onclick=close;m.addEventListener('click',e=>{if(e.target===m)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
async function legal(){try{const {data,error}=await supabaseClient.from('site_settings').select('key,content').in('key',['copyright','privacy']);if(error)throw error;const map=new Map((data||[]).map(x=>[x.key,x.content]));document.getElementById('copyrightContent').textContent=map.get('copyright')||'لم تُضف معلومات حقوق الطبع والنشر بعد.';document.getElementById('privacyContent').textContent=map.get('privacy')||'لم تُضف سياسة الخصوصية بعد.'}catch(e){document.getElementById('copyrightContent').textContent='شغّل ملف SQL الجديد لتفعيل هذا القسم.';document.getElementById('privacyContent').textContent='شغّل ملف SQL الجديد لتفعيل هذا القسم.'}}legal();
})();
</script></body></html>
