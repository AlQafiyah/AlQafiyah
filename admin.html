<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>لوحة الإدارة | قافية</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #3E2723;
        }

        .screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .box {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border-radius: 18px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        p {
            line-height: 1.8;
        }

        .loading {
            font-size: 20px;
        }

        .denied {
            display: none;
        }

        .admin-panel {
            display: none;
            width: 100%;
            min-height: 100vh;
        }

        .admin-header {
            background: #3E2723;
            color: #ffffff;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .admin-header h1 {
            margin: 0;
            font-size: 24px;
        }

        .admin-content {
            padding: 40px;
            max-width: 1400px;
            margin: auto;
        }

        .admin-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
        }

        .admin-role {
            display: inline-block;
            margin-top: 10px;
            padding: 7px 14px;
            border-radius: 20px;
            background: #FFE8D6;
            color: #3E2723;
            font-weight: bold;
        }

        button,
        .back-button {
            border: 0;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            padding: 11px 18px;
            border-radius: 10px;
            font-size: 15px;
        }

        .logout-button {
            background: #ffffff;
            color: #3E2723;
        }

        .back-button {
            background: #3E2723;
            color: #ffffff;
            margin-top: 15px;
        }

    </style>

</head>

<body>

    <!-- التحقق -->

    <div
        class="screen"
        id="checkingScreen"
    >

        <div class="box">

            <div class="loading">
                جارٍ التحقق من صلاحيات الإدارة...
            </div>

        </div>

    </div>


    <!-- ممنوع -->

    <div
        class="screen denied"
        id="deniedScreen"
    >

        <div class="box">

            <h1>غير مصرح</h1>

            <p>
                هذا الحساب لا يملك صلاحية الوصول إلى لوحة الإدارة.
            </p>

            <a
                class="back-button"
                href="index.html"
            >
                العودة إلى الموقع
            </a>

        </div>

    </div>


    <!-- لوحة الإدارة -->

    <div
        class="admin-panel"
        id="adminPanel"
    >

        <header class="admin-header">

            <h1>
                لوحة إدارة قافية
            </h1>

            <button
                class="logout-button"
                id="adminLogoutButton"
                type="button"
            >
                تسجيل الخروج
            </button>

        </header>


        <main class="admin-content">

            <div class="admin-card">

                <h2>
                    مرحبًا بك في لوحة الإدارة
                </h2>

                <p id="adminEmail">
                    البريد الإلكتروني:
                </p>

                <div
                    class="admin-role"
                    id="adminRole"
                >
                    الصلاحية
                </div>

                <p>
                    تم التحقق من صلاحيات حسابك بنجاح.
                </p>

            </div>

        </main>

    </div>


    <script>

        "use strict";


        async function checkAdminAccess() {

            const checkingScreen =
                document.getElementById("checkingScreen");

            const deniedScreen =
                document.getElementById("deniedScreen");

            const adminPanel =
                document.getElementById("adminPanel");

            const adminEmail =
                document.getElementById("adminEmail");

            const adminRole =
                document.getElementById("adminRole");


            try {

                /*
                 * الحصول على جلسة المستخدم الحالية
                 */

                const {
                    data: sessionData,
                    error: sessionError
                } =
                    await supabaseClient.auth.getSession();


                if (
                    sessionError ||
                    !sessionData ||
                    !sessionData.session ||
                    !sessionData.session.user
                ) {

                    checkingScreen.style.display = "none";
                    deniedScreen.style.display = "flex";

                    return;
                }


                const user =
                    sessionData.session.user;


                /*
                 * التحقق من صلاحية الإدارة
                 * من خلال دالة آمنة في Supabase
                 */

                const {
                    data: adminData,
                    error: adminError
                } =
                    await supabaseClient.rpc(
                        "get_my_admin_role"
                    );


                console.log(
                    "Qafiyah Admin:",
                    adminData
                );

                console.log(
                    "Qafiyah Admin Error:",
                    adminError
                );


                if (
                    adminError ||
                    !adminData ||
                    adminData.length === 0
                ) {

                    checkingScreen.style.display = "none";
                    deniedScreen.style.display = "flex";

                    return;
                }


                const admin =
                    adminData[0];


                /*
                 * الحساب غير مفعل
                 */

                if (admin.is_active !== true) {

                    checkingScreen.style.display = "none";
                    deniedScreen.style.display = "flex";

                    return;
                }


                /*
                 * السماح بالدخول
                 */

                checkingScreen.style.display = "none";
                deniedScreen.style.display = "none";
                adminPanel.style.display = "block";


                adminEmail.textContent =
                    "البريد الإلكتروني: " +
                    (user.email || "غير متوفر");


                adminRole.textContent =
                    "الصلاحية: " +
                    admin.role;


            } catch (error) {

                console.error(
                    "Qafiyah Admin Error:",
                    error
                );

                checkingScreen.style.display = "none";
                deniedScreen.style.display = "flex";

            }

        }


        /*
         * تسجيل الخروج
         */

        document
            .getElementById("adminLogoutButton")
            .addEventListener(
                "click",
                async function () {

                    await supabaseClient.auth.signOut();

                    window.location.href =
                        "index.html";

                }
            );


        /*
         * تشغيل التحقق
         */

        checkAdminAccess();

    </script>

</body>

</html>
