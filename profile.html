<!DOCTYPE html>

<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>الملف الشخصي - قافية</title>
<link href="style.css" rel="stylesheet"/>
<link href="enhancements.css?v=footer-final-3" rel="stylesheet"/>
</head>
<body>
<script>(function(){try{var t=localStorage.getItem('qafiyah_theme')||'natural';if(t==='light')t='evening';if(!/^(natural|dark|morning|evening|night)$/.test(t))t='natural';document.documentElement.setAttribute('data-q-theme',t);document.body.setAttribute('data-q-theme',t)}catch(e){}})();</script>
<!-- =====================================================
         الهيدر
    ====================================================== -->

<!-- =====================================================
         طبقة القائمة
    ====================================================== -->

<!-- =====================================================
         القائمة الجانبية
    ====================================================== -->

<!-- =====================================================
         الإشعارات
    ====================================================== -->

<!-- =====================================================
         صفحة الملف الشخصي
    ====================================================== -->
<main class="profile-page">
<section class="profile-container">
<!-- =================================================
                 العنوان
            ================================================== -->
<div class="profile-heading">
<h1>
                    الملف الشخصي
                </h1>
<p>
                    إدارة معلومات حسابك الشخصي
                </p>
</div>
<!-- =================================================
                 البطاقة الرئيسية
            ================================================== -->
<div class="profile-card">
<!-- =================================================
                     الصورة الشخصية
                ================================================== -->
<div class="profile-photo-section">
<div aria-label="الصورة الشخصية" class="profile-photo" id="profileAvatar">
<svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="8" r="4">
</circle>
<path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7">
</path>
</svg>
</div>
<!-- =================================================
                         أزرار الصورة
                    ================================================== -->
<div class="profile-photo-actions">
<label class="profile-upload-button" for="avatarInput">

                            إضافة / تغيير الصورة

                        </label>
<input accept="image/jpeg,image/png,image/webp" hidden="" id="avatarInput" type="file"/>
<button class="profile-delete-button" id="deleteAvatarButton" type="button">

                            حذف الصورة

                        </button>
</div>
<small>

                        JPG أو PNG أو WebP — بحد أقصى 5MB

                    </small>
</div>
<!-- =================================================
                     بيانات الحساب
                ================================================== -->
<form class="profile-form" id="profileForm">
<div class="profile-fields">
<!-- الاسم الأول -->
<div class="profile-field">
<label for="profileFirstName">

                                الاسم الأول

                            </label>
<input autocomplete="given-name" id="profileFirstName" required="" type="text"/>
</div>
<!-- اسم العائلة -->
<div class="profile-field">
<label for="profileLastName">

                                اسم العائلة

                            </label>
<input autocomplete="family-name" id="profileLastName" type="text"/>
</div>
<!-- البريد -->
<div class="profile-field">
<label for="profileEmailDetails">

                                البريد الإلكتروني

                            </label>
<input autocomplete="email" id="profileEmailDetails" readonly="" type="email"/>
</div>
<!-- الجوال -->
<div class="profile-field">
<label for="profilePhone">

                                رقم الجوال

                            </label>
<input autocomplete="tel" id="profilePhone" inputmode="tel" placeholder="+9665XXXXXXXX" type="tel"/>
</div>
<!-- يوم الميلاد -->
<div class="profile-field">
<label for="profileBirthDay">

                                يوم الميلاد

                            </label>
<select id="profileBirthDay" required="">
<option value="">
                                    اليوم
                                </option>
</select>
</div>
<!-- شهر الميلاد -->
<div class="profile-field">
<label for="profileBirthMonth">

                                شهر الميلاد

                            </label>
<select id="profileBirthMonth" required="">
<option value="">
                                    الشهر
                                </option>
<option value="1">
                                    يناير
                                </option>
<option value="2">
                                    فبراير
                                </option>
<option value="3">
                                    مارس
                                </option>
<option value="4">
                                    أبريل
                                </option>
<option value="5">
                                    مايو
                                </option>
<option value="6">
                                    يونيو
                                </option>
<option value="7">
                                    يوليو
                                </option>
<option value="8">
                                    أغسطس
                                </option>
<option value="9">
                                    سبتمبر
                                </option>
<option value="10">
                                    أكتوبر
                                </option>
<option value="11">
                                    نوفمبر
                                </option>
<option value="12">
                                    ديسمبر
                                </option>
</select>
</div>
<!-- سنة الميلاد -->
<div class="profile-field">
<label for="profileBirthYear">

                                سنة الميلاد

                            </label>
<select id="profileBirthYear" required="">
<option value="">
                                    السنة
                                </option>
</select>
</div>
<!-- الجنس -->
<div class="profile-field">
<label for="profileGender">

                                الجنس

                            </label>
<select id="profileGender" required="">
<option value="">
                                    اختر
                                </option>
<option value="male">
                                    ذكر
                                </option>
<option value="female">
                                    أنثى
                                </option>
</select>
</div>
</div>
<!-- =================================================
                         أزرار الحساب
                    ================================================== -->
<div class="profile-save-area">
<button class="profile-save-button" id="saveProfileButton" type="submit">

                            حفظ التغييرات

                        </button>
<button class="profile-logout-button" id="logoutButton" type="button">

                            تسجيل الخروج

                        </button>
</div>
<!-- =================================================
                         رسائل النظام
                    ================================================== -->
<p aria-live="polite" class="profile-message" id="profileMessage">
</p>
</form>
</div>
</section>
</main>
<!-- =====================================================
         نافذة تسجيل الدخول
    ====================================================== -->
<div aria-hidden="true" class="login-modal" id="loginModal">
<div class="login-box">
<button aria-label="إغلاق" class="close-login-button" id="closeLoginButton" type="button">

                ×

            </button>
<!-- =================================================
                 تسجيل الدخول
            ================================================== -->
<div id="loginForm">
<h2>
                    تسجيل الدخول
                </h2>
<input autocomplete="email" id="emailLogin" placeholder="البريد الإلكتروني" type="email"/>
<input autocomplete="current-password" id="passwordLogin" placeholder="كلمة المرور" type="password"/>
<button class="login-submit" id="emailLoginButton" type="button">

                    تسجيل الدخول

                </button>
<div class="login-register">

                    ليس لديك حساب؟

                    <button id="showRegisterButton" type="button">

                        إنشاء حساب

                    </button>
</div>
</div>
<!-- =================================================
                 إنشاء الحساب
            ================================================== -->
<div id="registerForm" style="display: none;">
<h2>
                    إنشاء حساب
                </h2>
<input autocomplete="given-name" id="firstName" placeholder="الاسم الأول" type="text"/>
<input autocomplete="family-name" id="lastName" placeholder="اسم العائلة" type="text"/>
<div class="birth-date-fields">
<select id="birthDay">
<option value="">
                            اليوم
                        </option>
</select>
<select id="birthMonth">
<option value="">
                            الشهر
                        </option>
<option value="1">
                            يناير
                        </option>
<option value="2">
                            فبراير
                        </option>
<option value="3">
                            مارس
                        </option>
<option value="4">
                            أبريل
                        </option>
<option value="5">
                            مايو
                        </option>
<option value="6">
                            يونيو
                        </option>
<option value="7">
                            يوليو
                        </option>
<option value="8">
                            أغسطس
                        </option>
<option value="9">
                            سبتمبر
                        </option>
<option value="10">
                            أكتوبر
                        </option>
<option value="11">
                            نوفمبر
                        </option>
<option value="12">
                            ديسمبر
                        </option>
</select>
<select id="birthYear">
<option value="">
                            السنة
                        </option>
</select>
</div>
<select id="gender">
<option value="">
                        الجنس
                    </option>
<option value="male">
                        ذكر
                    </option>
<option value="female">
                        أنثى
                    </option>
</select>
<input autocomplete="email" id="emailRegister" placeholder="البريد الإلكتروني" type="email"/>
<input autocomplete="new-password" id="passwordRegister" placeholder="كلمة المرور" type="password"/>
<input autocomplete="new-password" id="confirmPasswordRegister" placeholder="تأكيد كلمة المرور" type="password"/>
<button class="login-submit" id="registerSubmitButton" type="button">

                    إنشاء الحساب

                </button>
<div class="login-register">

                    لديك حساب بالفعل؟

                    <button id="showLoginButton" type="button">

                        تسجيل الدخول

                    </button>
</div>
</div>
</div>
</div>
<!-- =====================================================
         Supabase
    ====================================================== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>
<script src="supabase.js">
</script>
<script src="script.js">
</script>
<script src="enhancements.js?v=footer-final-3"></script>
</body>
</html>
