<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>الملف الشخصي - قافية</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


    <!-- =====================================================
         الهيدر
    ====================================================== -->

    <header class="site-header">

        <div class="header-container">


            <button
                class="menu-button"
                id="menuButton"
                type="button"
                aria-label="القائمة"
                title="القائمة">

                <span></span>
                <span></span>
                <span></span>

            </button>


            <a
                href="index.html"
                class="site-logo"
                aria-label="قافية">

                قافية

            </a>


            <div class="header-actions">


                <!-- =================================================
                     الإشعارات
                ================================================== -->

                <button
                    class="notification-button"
                    id="notificationButton"
                    type="button"
                    aria-label="الإشعارات"
                    title="الإشعارات">

                    <svg
                        class="notification-icon"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true">

                        <path
                            d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9">
                        </path>

                        <path
                            d="M10 21h4">
                        </path>

                    </svg>


                    <span
                        class="notification-count"
                        id="notificationCount">

                        0

                    </span>

                </button>


                <!-- =================================================
                     تسجيل الدخول
                ================================================== -->

                <button
                    class="login-button"
                    id="loginButton"
                    type="button">

                    تسجيل الدخول

                </button>


            </div>

        </div>

    </header>



    <!-- =====================================================
         طبقة القائمة
    ====================================================== -->

    <div
        class="menu-overlay"
        id="menuOverlay">
    </div>



    <!-- =====================================================
         القائمة الجانبية
    ====================================================== -->

    <aside
        class="side-menu"
        id="sideMenu"
        aria-hidden="true">


        <div class="side-menu-header">

            <h2>
                القائمة
            </h2>


            <button
                class="close-menu-button"
                id="closeMenuButton"
                type="button"
                aria-label="إغلاق القائمة">

                ×

            </button>

        </div>



        <!-- =================================================
             المستخدم
        ================================================== -->

        <div
            class="user-section"
            id="userSection">


            <div class="user-avatar">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true">

                    <circle
                        cx="12"
                        cy="8"
                        r="4">
                    </circle>

                    <path
                        d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7">
                    </path>

                </svg>

            </div>


            <div class="user-info">

                <strong id="menuUserName">
                    مرحبًا بك
                </strong>

                <span id="menuUserEmail">
                    سجّل الدخول للمتابعة
                </span>

            </div>

        </div>



        <!-- =================================================
             التنقل
        ================================================== -->

        <nav
            class="side-navigation"
            aria-label="التنقل الرئيسي">


            <a
                href="profile.html"
                id="profileLink"
                class="active">

                <span aria-hidden="true">
                    ◉
                </span>

                <span>
                    الملف الشخصي
                </span>

            </a>


            <a
                href="#"
                id="favoritesLink">

                <span aria-hidden="true">
                    ♡
                </span>

                <span>
                    المفضلة
                </span>

            </a>


            <a
                href="#"
                id="settingsLink">

                <span aria-hidden="true">
                    ⚙
                </span>

                <span>
                    الإعدادات
                </span>

            </a>


        </nav>

    </aside>



    <!-- =====================================================
         الإشعارات
    ====================================================== -->

    <aside
        class="notification-panel"
        id="notificationPanel"
        aria-hidden="true">


        <div class="notification-header">

            <h3>
                الإشعارات
            </h3>


            <button
                id="closeNotificationButton"
                type="button"
                aria-label="إغلاق الإشعارات">

                ×

            </button>

        </div>


        <div class="notification-content">

            لا توجد إشعارات جديدة.

        </div>

    </aside>



    <!-- =====================================================
         صفحة الملف الشخصي
    ====================================================== -->

    <main class="profile-page">


        <section class="profile-container">


            <!-- =================================================
                 العنوان
            ================================================== -->

            <div class="profile-heading">

                <h1>
                    الملف الشخصي
                </h1>

                <p>
                    إدارة معلومات حسابك الشخصي
                </p>

            </div>



            <!-- =================================================
                 البطاقة الرئيسية
            ================================================== -->

            <div class="profile-card">


                <!-- =================================================
                     الصورة الشخصية
                ================================================== -->

                <div class="profile-photo-section">


                    <div
                        class="profile-photo"
                        id="profileAvatar"
                        aria-label="الصورة الشخصية">


                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true">

                            <circle
                                cx="12"
                                cy="8"
                                r="4">
                            </circle>

                            <path
                                d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7">
                            </path>

                        </svg>


                    </div>



                    <!-- =================================================
                         أزرار الصورة
                    ================================================== -->

                    <div class="profile-photo-actions">


                        <label
                            for="avatarInput"
                            class="profile-upload-button">

                            إضافة / تغيير الصورة

                        </label>


                        <input
                            type="file"
                            id="avatarInput"
                            accept="image/jpeg,image/png,image/webp"
                            hidden>


                        <button
                            type="button"
                            id="deleteAvatarButton"
                            class="profile-delete-button">

                            حذف الصورة

                        </button>


                    </div>


                    <small>

                        JPG أو PNG أو WebP — بحد أقصى 5MB

                    </small>


                </div>



                <!-- =================================================
                     بيانات الحساب
                ================================================== -->

                <form
                    id="profileForm"
                    class="profile-form">


                    <div class="profile-fields">


                        <!-- الاسم الأول -->

                        <div class="profile-field">

                            <label
                                for="profileFirstName">

                                الاسم الأول

                            </label>

                            <input
                                type="text"
                                id="profileFirstName"
                                autocomplete="given-name"
                                required>

                        </div>



                        <!-- اسم العائلة -->

                        <div class="profile-field">

                            <label
                                for="profileLastName">

                                اسم العائلة

                            </label>

                            <input
                                type="text"
                                id="profileLastName"
                                autocomplete="family-name">

                        </div>



                        <!-- البريد -->

                        <div class="profile-field">

                            <label
                                for="profileEmailDetails">

                                البريد الإلكتروني

                            </label>

                            <input
                                type="email"
                                id="profileEmailDetails"
                                autocomplete="email"
                                readonly>

                        </div>



                        <!-- الجوال -->

                        <div class="profile-field">

                            <label
                                for="profilePhone">

                                رقم الجوال

                            </label>

                            <input
                                type="tel"
                                id="profilePhone"
                                inputmode="tel"
                                autocomplete="tel"
                                placeholder="+9665XXXXXXXX">

                        </div>



                        <!-- يوم الميلاد -->

                        <div class="profile-field">

                            <label
                                for="profileBirthDay">

                                يوم الميلاد

                            </label>

                            <select
                                id="profileBirthDay"
                                required>

                                <option value="">
                                    اليوم
                                </option>

                            </select>

                        </div>



                        <!-- شهر الميلاد -->

                        <div class="profile-field">

                            <label
                                for="profileBirthMonth">

                                شهر الميلاد

                            </label>

                            <select
                                id="profileBirthMonth"
                                required>

                                <option value="">
                                    الشهر
                                </option>

                                <option value="1">
                                    يناير
                                </option>

                                <option value="2">
                                    فبراير
                                </option>

                                <option value="3">
                                    مارس
                                </option>

                                <option value="4">
                                    أبريل
                                </option>

                                <option value="5">
                                    مايو
                                </option>

                                <option value="6">
                                    يونيو
                                </option>

                                <option value="7">
                                    يوليو
                                </option>

                                <option value="8">
                                    أغسطس
                                </option>

                                <option value="9">
                                    سبتمبر
                                </option>

                                <option value="10">
                                    أكتوبر
                                </option>

                                <option value="11">
                                    نوفمبر
                                </option>

                                <option value="12">
                                    ديسمبر
                                </option>

                            </select>

                        </div>



                        <!-- سنة الميلاد -->

                        <div class="profile-field">

                            <label
                                for="profileBirthYear">

                                سنة الميلاد

                            </label>

                            <select
                                id="profileBirthYear"
                                required>

                                <option value="">
                                    السنة
                                </option>

                            </select>

                        </div>



                        <!-- الجنس -->

                        <div class="profile-field">

                            <label
                                for="profileGender">

                                الجنس

                            </label>

                            <select
                                id="profileGender"
                                required>

                                <option value="">
                                    اختر
                                </option>

                                <option value="male">
                                    ذكر
                                </option>

                                <option value="female">
                                    أنثى
                                </option>

                            </select>

                        </div>


                    </div>



                    <!-- =================================================
                         أزرار الحساب
                    ================================================== -->

                    <div class="profile-save-area">


                        <button
                            type="submit"
                            id="saveProfileButton"
                            class="profile-save-button">

                            حفظ التغييرات

                        </button>


                        <button
                            type="button"
                            id="logoutButton"
                            class="profile-logout-button">

                            تسجيل الخروج

                        </button>


                    </div>



                    <!-- =================================================
                         رسائل النظام
                    ================================================== -->

                    <p
                        id="profileMessage"
                        class="profile-message"
                        aria-live="polite">
                    </p>


                </form>


            </div>

        </section>

    </main>



    <!-- =====================================================
         نافذة تسجيل الدخول
    ====================================================== -->

    <div
        class="login-modal"
        id="loginModal"
        aria-hidden="true">


        <div class="login-box">


            <button
                class="close-login-button"
                id="closeLoginButton"
                type="button"
                aria-label="إغلاق">

                ×

            </button>



            <!-- =================================================
                 تسجيل الدخول
            ================================================== -->

            <div id="loginForm">


                <h2>
                    تسجيل الدخول
                </h2>


                <input
                    type="email"
                    id="emailLogin"
                    autocomplete="email"
                    placeholder="البريد الإلكتروني">


                <input
                    type="password"
                    id="passwordLogin"
                    autocomplete="current-password"
                    placeholder="كلمة المرور">


                <button
                    type="button"
                    id="emailLoginButton"
                    class="login-submit">

                    تسجيل الدخول

                </button>


                <button
                    type="button"
                    id="appleLoginButton"
                    class="login-submit">

                    تسجيل الدخول باستخدام Apple

                </button>


                <div class="login-register">

                    ليس لديك حساب؟

                    <button
                        type="button"
                        id="showRegisterButton">

                        إنشاء حساب

                    </button>

                </div>


            </div>



            <!-- =================================================
                 إنشاء الحساب
            ================================================== -->

            <div
                id="registerForm"
                style="display: none;">


                <h2>
                    إنشاء حساب
                </h2>


                <input
                    type="text"
                    id="firstName"
                    autocomplete="given-name"
                    placeholder="الاسم الأول">


                <input
                    type="text"
                    id="lastName"
                    autocomplete="family-name"
                    placeholder="اسم العائلة">



                <div class="birth-date-fields">


                    <select id="birthDay">

                        <option value="">
                            اليوم
                        </option>

                    </select>


                    <select id="birthMonth">

                        <option value="">
                            الشهر
                        </option>

                        <option value="1">
                            يناير
                        </option>

                        <option value="2">
                            فبراير
                        </option>

                        <option value="3">
                            مارس
                        </option>

                        <option value="4">
                            أبريل
                        </option>

                        <option value="5">
                            مايو
                        </option>

                        <option value="6">
                            يونيو
                        </option>

                        <option value="7">
                            يوليو
                        </option>

                        <option value="8">
                            أغسطس
                        </option>

                        <option value="9">
                            سبتمبر
                        </option>

                        <option value="10">
                            أكتوبر
                        </option>

                        <option value="11">
                            نوفمبر
                        </option>

                        <option value="12">
                            ديسمبر
                        </option>

                    </select>


                    <select id="birthYear">

                        <option value="">
                            السنة
                        </option>

                    </select>


                </div>



                <select id="gender">

                    <option value="">
                        الجنس
                    </option>

                    <option value="male">
                        ذكر
                    </option>

                    <option value="female">
                        أنثى
                    </option>

                </select>



                <input
                    type="email"
                    id="emailRegister"
                    autocomplete="email"
                    placeholder="البريد الإلكتروني">


                <input
                    type="password"
                    id="passwordRegister"
                    autocomplete="new-password"
                    placeholder="كلمة المرور">


                <input
                    type="password"
                    id="confirmPasswordRegister"
                    autocomplete="new-password"
                    placeholder="تأكيد كلمة المرور">


                <button
                    type="button"
                    id="registerSubmitButton"
                    class="login-submit">

                    إنشاء الحساب

                </button>



                <div class="login-register">

                    لديك حساب بالفعل؟

                    <button
                        type="button"
                        id="showLoginButton">

                        تسجيل الدخول

                    </button>

                </div>


            </div>


        </div>

    </div>



    <!-- =====================================================
         Supabase
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <script
        src="supabase.js">
    </script>


    <script
        src="script.js">
    </script>


</body>

</html>
